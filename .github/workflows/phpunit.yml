<?php

class NativePairingHardeningTest extends DBSD_TestCase {

    public function set_up() {
        parent::set_up();

        update_option('dbsd_pairing_max_attempts', 3);
        update_option('dbsd_pairing_max_failed_per_device_hour', 10);
    }

    public function test_pair_device_requires_pairing_id_and_code() {
        wp_set_current_user(0);

        $response = $this->rest_request(
            'POST',
            '/datebook-safedate/v1/mobile/pair-device',
            array(
                'code'        => 'ABCDEF1234',
                'device_uuid' => 'android-device-001',
            )
        );

        $this->assertEquals(400, $response->get_status());
    }

    public function test_wrong_code_increments_attempt_count_and_locks_code() {
        global $wpdb;

        wp_set_current_user($this->traveler_id);

        $created_response = $this->rest_request(
            'POST',
            '/datebook-safedate/v1/mobile/pairing-code',
            array()
        );

        $created = $created_response->get_data();

        $this->assertArrayHasKey('pairing_id', $created);
        $this->assertArrayHasKey('code', $created);

        wp_set_current_user(0);

        /*
         * The lockout threshold is 3.
         * Therefore this test must send 3 wrong-code attempts.
         */
        for ($i = 1; $i <= 3; $i++) {
            $wrong_response = $this->rest_request(
                'POST',
                '/datebook-safedate/v1/mobile/pair-device',
                array(
                    'pairing_id'  => $created['pairing_id'],
                    'code'        => 'BADCODE' . $i,
                    'device_uuid' => 'bad-device-' . $i,
                    'platform'    => 'android',
                )
            );

            $this->assertEquals(403, $wrong_response->get_status());
        }

        $row = $wpdb->get_row(
            $wpdb->prepare(
                'SELECT attempt_count, locked_at, status FROM ' . $this->table('mobile_pairing_codes') . ' WHERE id=%d',
                $created['pairing_id']
            )
        );

        $this->assertNotEmpty($row);
        $this->assertGreaterThanOrEqual(3, (int) $row->attempt_count);
        $this->assertNotEmpty($row->locked_at);

        /*
         * After lockout, even the correct code must fail.
         */
        $valid_after_lock = $this->rest_request(
            'POST',
            '/datebook-safedate/v1/mobile/pair-device',
            array(
                'pairing_id'  => $created['pairing_id'],
                'code'        => $created['code'],
                'device_uuid' => 'ios-device-locked',
                'platform'    => 'ios',
            )
        );

        $this->assertEquals(403, $valid_after_lock->get_status());
    }

    public function test_pairing_claim_sets_intermediate_claiming_state_atomically() {
        wp_set_current_user($this->traveler_id);

        $created_response = $this->rest_request(
            'POST',
            '/datebook-safedate/v1/mobile/pairing-code',
            array()
        );

        $created = $created_response->get_data();

        $this->assertArrayHasKey('pairing_id', $created);
        $this->assertArrayHasKey('code', $created);

        wp_set_current_user(0);

        $first = $this->rest_request(
            'POST',
            '/datebook-safedate/v1/mobile/pair-device',
            array(
                'pairing_id'  => $created['pairing_id'],
                'code'        => $created['code'],
                'device_uuid' => 'atomic-device-1',
                'platform'    => 'android',
            )
        );

        $this->assertEquals(200, $first->get_status());

        /*
         * A second claim with the same code must fail because the code
         * should already be claimed/used.
         */
        $second = $this->rest_request(
            'POST',
            '/datebook-safedate/v1/mobile/pair-device',
            array(
                'pairing_id'  => $created['pairing_id'],
                'code'        => $created['code'],
                'device_uuid' => 'atomic-device-2',
                'platform'    => 'android',
            )
        );

        $this->assertContains($second->get_status(), array(403, 409));
    }
}
